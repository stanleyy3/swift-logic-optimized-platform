# link.cfg -- v++ link configuration for matmul_krnl against
# xilinx_kv260_base_202520_1.
#
# Note this platform is hardware-only (platforminfo reports
# "Has Hardware Emulation: 0"), so the link target must be `-t hw`; `-t hw_emu`
# fails with [v++ 60-2453] and there is no emulation path to fall back on.

[connectivity]
# The DataMover's MM2S and S2MM sides are independent AXI masters (see
# CONTROL_INTERFACE.md), so they get separate HP ports rather than contending
# for one: reads of a_block/b_block on HP0, writes of c_block on HP1.
sp=matmul_krnl_1.m_axi_gmem:HP0
sp=matmul_krnl_1.m_axi_gmem1:HP1

[clock]
# Conservative for first bring-up: the array's mac -> fix_to_float path is long.
# Raise once this closes timing with margin.
freqHz=100000000:matmul_krnl_1
